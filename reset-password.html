<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | StudyTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <main class="auth-main">

        <div class="auth-card" id="reset-request-card">

            <a href="login.html" class="logo auth-logo">StudyTrack</a>

            <h1>Reset your password</h1>
            <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

            <form id="reset-form" novalidate>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required>
                    <p class="field-error" id="email-error" hidden>Please enter a valid email.</p>
                </div>

                <p class="form-error" id="form-error" hidden></p>

                <button type="submit" class="submit-button auth-submit" id="submit-button">
                    Send Reset Link
                </button>

            </form>

            <p class="auth-footer-text">
                Remembered your password? <a href="login.html" class="auth-link">Log in</a>
            </p>

        </div>

        <!-- Shown after the reset email is "sent" -->
        <div class="auth-card" id="reset-sent-card" hidden>

            <a href="login.html" class="logo auth-logo">StudyTrack</a>

            <h1>Check your email</h1>
            <p class="auth-subtitle" id="reset-sent-message">
                We've sent a password reset link to your email address.
            </p>

            <a href="login.html" class="submit-button auth-submit auth-submit-link">
                Back to Log In
            </a>

        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
